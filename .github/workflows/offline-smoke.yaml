name: Offline API smoke test
on:
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/smoke_test.py'
      - 'requirements.txt'
      - '.github/workflows/offline-smoke.yaml'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      LLM_FIXTURE_MODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install fastapi prometheus-client httpx
      - name: Verify fixture response and metrics
        run: python -m scripts.smoke_test
